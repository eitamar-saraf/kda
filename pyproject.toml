[project]
name = "kda"
version = "0.1.0"
description = "An illustrated, executable explainer for Kimi Delta Attention (arXiv:2510.26692)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8", "numpy>=1.26"]
train = ["numpy>=1.26", "datasets>=2.20", "tiktoken>=0.7", "tqdm>=4.66"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kda*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
